# SPDX-License-Identifier: Apache-2.0
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query still finds an untouched code path.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required for the action's own status reporting; without it the job ends
      # in "Resource not accessible by integration" even when the scan worked.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          # security-extended adds the lower-precision queries; worth the noise
          # on a service that handles request bodies and file paths.
          queries: security-extended

      # No build step: the JavaScript/TypeScript analysis reads the sources
      # directly.
      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
