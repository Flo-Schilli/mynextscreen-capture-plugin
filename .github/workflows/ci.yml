name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-test:
    name: lint · typecheck · test · audit · gitleaks · NDI denylist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to scan only its diff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the denylist and gitleaks look at every commit of a PR

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: |
          # Match the npm pinned in package.json: the lockfile is written by it.
          npm i -g npm@12.2.0
          npm ci

      # NDI SDK files are Confidential Information (SDK License clause 3a) and
      # must never enter the repository. Checks the tracked tree and, on pull
      # requests, every file touched by any commit of the PR. The built image is
      # checked separately in the docker job.
      - name: NDI SDK denylist
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/denylist.sh "origin/${{ github.base_ref }}"
          else
            scripts/denylist.sh
          fi

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      # Production dependencies only: the build toolchain never reaches the image.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the OpenAPI contract specs and the coverage gate (85/75/83/85).
      - name: Test
        run: npm test

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  # amd64 only: the NDI runtime is shipped for x86-64 general-purpose Linux.
  # The image is built and scanned before anything is published, so a
  # vulnerable image never reaches GHCR.
  docker:
    name: docker (amd64)
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image path + version metadata
        id: meta
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="${PKG_VERSION}+sha.${SHORT_SHA}"
          fi
          {
            echo "image=ghcr.io/flo-schilli/mynextscreen-capture-plugin"
            echo "app_version=${APP_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Date only, so the OS package layer is re-resolved once a day: distros
            # ship package fixes faster than the base image tag is rebuilt, and the
            # scan below gates on exactly those.
            echo "package_refresh=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: mns-capture-plugin:scan
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            PACKAGE_REFRESH=${{ steps.meta.outputs.package_refresh }}
          cache-from: type=gha,scope=capture-plugin
          cache-to: type=gha,mode=max,scope=capture-plugin

      # The plugin starts and reports license_required, FFmpeg has the expected
      # encoders, the image holds exactly the pinned libndi.so.6 and no SDK
      # headers or docs, and grandi loads only after the license was accepted.
      - name: Smoke-test the image
        run: scripts/smoke-image.sh mns-capture-plugin:scan

      # `ignore-unfixed`: an advisory with no upstream fix cannot be acted on
      # here, and blocking every release on one would mean turning the gate off.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mns-capture-plugin:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Docker tags + labels
        id: tags
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      # Published only on pushes to main and on version tags, never for PRs.
      # Rebuilds from the same cache, so only layers are uploaded.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            PACKAGE_REFRESH=${{ steps.meta.outputs.package_refresh }}
          cache-from: type=gha,scope=capture-plugin
          # SBOM and build provenance, so a deployed image can be traced back to
          # the commit and its contents listed without unpacking it.
          sbom: true
          provenance: mode=max
